<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulazione Fluido 3D - Vortice Planetario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }

        #info h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        #info p {
            margin: 5px 0;
            line-height: 1.5;
        }

        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .control-group {
            margin: 10px 0;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #4fc3f7;
        }

        .control-group input[type="range"] {
            width: 200px;
        }

        .control-group span {
            margin-left: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="info">
        <h1>🌊 Simulazione Vortice Etereo</h1>
        <p><strong>Teoria di Cartesio:</strong> Vortice cosmico</p>
        <p>Usa il mouse per ruotare la camera</p>
        <p>Scroll per zoom</p>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Velocità Rotazione: <span id="rotation-value">1.5</span></label>
            <input type="range" id="rotation-speed" min="0" max="5" step="0.1" value="1.5">
        </div>
        <div class="control-group">
            <label>Numero Particelle: <span id="particles-value">8000</span></label>
            <input type="range" id="particle-count" min="1000" max="20000" step="1000" value="8000">
        </div>
    </div>

    <!-- Three.js da CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls per controllare la camera -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- js-yaml per parsare il file YAML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <!-- Classi OOP -->
    <script src="classes.js"></script>
    <!-- Script principale -->
    <script src="main.js"></script>
</body>

</html>
